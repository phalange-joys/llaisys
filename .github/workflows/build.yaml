name: Build and test
on:
  pull_request:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch: 

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        type: [release]
    runs-on: ${{ matrix.os }}
    steps:

    - name: checkout code
      uses: actions/checkout@v4

    - name: install xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
    
    - name: prepare env for macos
      if: runner.os == 'macOS'
      run: |
        brew install gcc
        gcc --version
    
    - name: Xmake Build & Install
      run: | 
        xmake
        xmake install
    
    - name: Install Python
      run: | 
        cd python
        pip install .
        cd ..

    - name: Assignment-0
      run: |
        python test/test_runtime.py --device cpu

    - name: Assignment-1
      run: |
        python test/test_tensor.py
    
    - name: Assignment-2
      run: |
        python test/ops/add.py 
        python test/ops/argmax.py
        python test/ops/embedding.py
        python test/ops/linear.py 
        python test/ops/rms_norm.py
        python test/ops/rope.py
        python test/ops/self_attention.py
        python test/ops/swiglu.py

    - name: Assignment-3
      run: |
        python test/test_infer.py --test

    - name: Assignment-3.5
      shell: bash
      run: |
        MODEL_PATH=$(find ~/.cache/huggingface/hub \
          -path '*deepseek-ai*DeepSeek-R1-Distill-Qwen-1.5B' \
          -type d \
          -name 'DeepSeek-R1-Distill-Qwen-1.5B' \
          | head -1)
        echo "MODEL_PATH=$MODEL_PATH"

        python test/test_infer.py --device cpu \
          --model "$MODEL_PATH" \
          --max_steps 256 \
          --top_k 50 \
          --top_p 0.9 \
          --temperature 0.8 \
          --prompt "你好，请介绍一下自己"
